<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>AI vs 원숭이 vs 존버</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 기기 폭을 보고 셋 중 하나로 그린다.
   PC(1024px~)는 본문 + 오른쪽 실시간 칸(스크롤해도 따라온다), 태블릿은 한 줄로 쭉,
   폰(~719px)은 아래 탭(순위·실시간·AI·보유)으로 한 칸씩. 테마는 자동·밝게·어둡게 */
:root {
  --page: #f4f5f8;
  --surface: #fcfcfd;
  --surface-2: #eceef3;
  --ink: #0f1419;
  --ink-2: #4b5563;
  --muted: #6b7280;
  --grid: #e6e8ed;
  --axis: #c5cad3;
  --hair: rgba(15, 20, 25, 0.10);
  --lift: rgba(15, 20, 25, 0.12);
  --up: #c62f2f;          /* 한국식: 오르면 빨강 */
  --down: #1c5cab;        /* 내리면 파랑 */
  --warn: #9a5b00;        /* 상태색(주의). 선수 색과 따로 쓴다 */
  --warn-bg: #fbf1df;
  --p-ai: #4a3aa7;
  --p-monkey: #eb6834;
  --p-hodl: #1baf7a;
  --shadow: 0 6px 20px rgba(15, 20, 25, 0.10);
  --nav-h: 58px;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-ui: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0e1116; --surface: #161a21; --surface-2: #212732; --ink: #eef1f5; --ink-2: #b4bcc8;
    --muted: #8a93a3; --grid: #262c36; --axis: #3a4250; --hair: rgba(255, 255, 255, 0.10); --lift: rgba(0, 0, 0, 0.5);
    --up: #ff7a7a; --down: #6da7ec; --warn: #f0b458; --warn-bg: #2b2416;
    --p-ai: #9085e9; --p-monkey: #d95926; --p-hodl: #199e70;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0e1116; --surface: #161a21; --surface-2: #212732; --ink: #eef1f5; --ink-2: #b4bcc8;
  --muted: #8a93a3; --grid: #262c36; --axis: #3a4250; --hair: rgba(255, 255, 255, 0.10); --lift: rgba(0, 0, 0, 0.5);
  --up: #ff7a7a; --down: #6da7ec; --warn: #f0b458; --warn-bg: #2b2416;
  --p-ai: #9085e9; --p-monkey: #d95926; --p-hodl: #199e70;
  --shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 20px; }
:root[data-layout="desktop"] .wrap { max-width: 1320px; padding-inline: 28px; }
:root[data-layout="phone"] .wrap { padding-block: 14px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px); gap: 14px; }

/* ---- 머리 ---- */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }
.brand { display: grid; gap: 8px; min-width: 0; max-width: 640px; }
.wordmark { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 6.4vw, 46px); line-height: 1.15; letter-spacing: -0.005em; }
.wordmark .team { text-decoration: underline; text-decoration-thickness: 0.11em; text-underline-offset: 0.16em; }
.wordmark .vs { font-size: 0.55em; color: var(--muted); padding-inline: 0.12em; vertical-align: 0.18em; }
.tagline { color: var(--ink-2); max-width: 60ch; }
.controls { display: grid; justify-items: end; gap: 8px; }
.stamp { color: var(--muted); font-size: 13px; text-align: right; }
:root[data-layout="phone"] .top { align-items: flex-start; }
:root[data-layout="phone"] .wordmark { font-size: 29px; }
:root[data-layout="phone"] .tagline { font-size: 13.5px; }
:root[data-layout="phone"] .controls { justify-items: start; }
:root[data-layout="phone"] .stamp { text-align: left; }

/* 여러 개 중 하나 고르는 버튼 묶음 (테마, 리그, 선수) */
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-2); max-width: 100%; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-selected="true"], .seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px var(--lift); }
.seg svg { width: 15px; height: 15px; flex: none; }
.seg.market { justify-self: start; }
.seg.market button { padding: 8px 18px; font-size: 14.5px; }
:root[data-layout="phone"] .seg.market { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); justify-self: stretch; }

.panel { display: grid; gap: 20px; }
:root[data-layout="phone"] .panel { gap: 14px; }
.status { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--ink-2); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); font-size: 12.5px; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.chip.live::before { background: var(--up); }

.headline { font-size: clamp(18px, 3.2vw, 22px); font-weight: 600; line-height: 1.45; }
.headline .soft { color: var(--ink-2); font-weight: 500; }
.luck { color: var(--ink-2); font-size: 13.5px; max-width: 75ch; }

.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
:root[data-layout="phone"] .card { padding: 16px; gap: 14px; }
.card-head { display: grid; gap: 4px; }
.card-head.row2 { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
.card-head h2 { font-size: 17px; font-weight: 700; }
.sub { color: var(--muted); font-size: 13px; }

/* ---- PC: 본문 + 오른쪽 실시간 칸 ---- */
.board { display: grid; gap: 20px; }
.mainc, .aside { display: grid; gap: 20px; align-content: start; min-width: 0; }
:root[data-layout="desktop"] .board { grid-template-columns: minmax(0, 1fr) minmax(320px, 390px); align-items: start; }
:root[data-layout="desktop"] .aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); grid-template-rows: auto minmax(0, 1fr); }
:root[data-layout="desktop"] .aside .feed-card { overflow-y: auto; overscroll-behavior: contain; align-content: start; }

/* ---- 순위 ---- */
.standings { list-style: none; margin: 0; padding: 0; display: grid; }
.row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 150px 150px 120px 64px; gap: 12px; align-items: center; padding: 14px 12px; border-top: 1px solid var(--hair); }
.row:first-child { border-top: 0; }
.row.lead { background: var(--surface-2); border-radius: 10px; border-top-color: transparent; }
.row.lead + .row { border-top-color: transparent; }
.rank { font-family: var(--font-display); font-size: 22px; color: var(--muted); text-align: center; }
.row.lead .rank { color: var(--ink); }
.who { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; align-items: center; min-width: 0; }
.key { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--surface); }
.name { font-weight: 700; font-size: 16px; }
.blurb { grid-column: 2; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.ret { font-size: 26px; font-weight: 600; line-height: 1.1; white-space: nowrap; }
.stat { display: grid; gap: 2px; font-size: 14px; white-space: nowrap; }
.stat .k { color: var(--muted); font-size: 12px; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta.flat { color: var(--muted); }

/* ---- 차트 ---- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 2px; border-radius: 1px; background: var(--c); }
.chart { position: relative; min-height: 120px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart svg:focus-visible { outline-offset: 4px; }
.tick { fill: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.endlabel { font-size: 12px; fill: var(--ink-2); }
.endlabel .v { fill: var(--ink); font-weight: 600; }
.empty { display: grid; gap: 4px; place-content: center; text-align: center; min-height: 160px; padding: 16px; border: 1px dashed var(--axis); border-radius: 10px; color: var(--ink-2); }
.empty strong { color: var(--ink); }

details > summary { cursor: pointer; color: var(--ink-2); font-size: 13.5px; font-weight: 600; width: fit-content; }
details > summary:hover { color: var(--ink); }
.scroll { overflow-x: auto; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.side.buy { color: var(--up); font-weight: 600; }
.side.sell { color: var(--down); font-weight: 600; }

/* ---- AI의 한 수 ---- */
.view { border-left: 3px solid var(--p-ai); padding: 2px 0 2px 14px; color: var(--ink); font-size: 15.5px; max-width: 70ch; }
.picks { list-style: none; margin: 0; padding: 0; display: grid; }
.pick { display: grid; grid-template-columns: minmax(0, 1fr) 160px; gap: 4px 20px; padding: 14px 0; border-top: 1px solid var(--hair); }
.pick:first-child { border-top: 0; padding-top: 4px; }
.pick-name { font-weight: 700; }
.pick-name .code { color: var(--muted); font-weight: 400; font-size: 12.5px; margin-left: 6px; }
.pick-why { grid-column: 1 / -1; color: var(--ink-2); font-size: 14px; max-width: 75ch; }
.wbar { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 10px; align-items: center; }
.track { height: 8px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.fill { display: block; height: 100%; background: var(--p-ai); border-radius: 0 4px 4px 0; }
.wbar .pctv { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.pick.cash .pick-name { color: var(--ink-2); }
.pick.cash .fill { background: var(--axis); }
.meta { color: var(--muted); font-size: 12.5px; }
.shortlist { display: grid; gap: 6px; margin: 10px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
.shortlist b { color: var(--ink); font-weight: 600; }
.error { color: var(--up); }
.notes { display: grid; gap: 4px; margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }

/* ---- 보유 종목 ---- */
.holdings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.hcol { display: grid; align-content: start; gap: 10px; min-width: 0; }
.hhead { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.hhead .eqv { margin-left: auto; font-weight: 500; color: var(--ink-2); font-size: 13.5px; }
.hlist { list-style: none; margin: 0; padding: 0; display: grid; }
.hitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; padding: 8px 0; border-top: 1px solid var(--hair); font-size: 14px; }
.hitem .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hitem .w { color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
.hitem .d { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.hitem .p { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.hnote { color: var(--muted); font-size: 13px; }
.sectors { display: grid; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.sectors .cap-k { color: var(--muted); font-size: 12px; }
.sec { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; align-items: center; font-size: 12.5px; }
.sec .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.sec .pv { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
.sec .bar { grid-column: 1 / -1; position: relative; height: 6px; border-radius: 3px; background: var(--surface); }
.sec .bar > span { display: block; height: 100%; border-radius: 3px; background: var(--p-ai); }
.sec .bar > i { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 1px; background: var(--ink-2); }
.sec.over .nm, .sec.over .pv { color: var(--warn); }
.sec.over .bar > span { background: var(--warn); }

/* ---- 매매 기록 (폰은 목록) ---- */
.tlist { list-style: none; margin: 0; padding: 0; display: grid; }
.tlist li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--hair); font-size: 14px; }
.tlist li:first-child { border-top: 0; }
.tlist .tname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.tlist .tmeta { grid-column: 2 / -1; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tlist .twho { color: var(--ink-2); font-size: 12.5px; }

.entries { display: grid; gap: 8px; }
.entry { border-top: 1px solid var(--hair); padding-top: 10px; }
.entry > div { display: grid; gap: 10px; margin-top: 10px; }

.foot { display: grid; gap: 10px; color: var(--ink-2); font-size: 13.5px; }
.foot h2 { font-size: 15px; color: var(--ink); }
.foot ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; max-width: 80ch; }
.foot .disclaimer { color: var(--muted); }

.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; box-shadow: var(--shadow); padding: 10px 12px; font-size: 13px; min-width: 190px; display: grid; gap: 6px; }
.tip .t-date { color: var(--muted); font-size: 12px; }
.tip .t-row { display: grid; grid-template-columns: 14px auto 1fr; gap: 8px; align-items: center; }
.tip .t-row i { width: 14px; height: 2px; border-radius: 1px; background: var(--c); }
.tip .t-row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .t-row span { color: var(--ink-2); text-align: right; }

/* ---- 실시간 ---- */
.rt-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--ink-2); font-size: 13px; }
.chip.on::before { background: var(--up); animation: pulse 1.6s ease-in-out infinite; }
.chip.warn::before { background: var(--warn); }
.chip.think::before { background: var(--p-ai); animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
.notice { display: grid; gap: 4px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--ink); font-size: 13.5px; }
.notice b { color: var(--warn); }
.notice ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; }
.fitem { display: grid; grid-template-columns: 62px 96px minmax(0, 1fr); gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--hair); font-size: 14px; align-items: baseline; }
.fitem:first-child { border-top: 0; padding-top: 2px; }
.aside .fitem, :root[data-layout="phone"] .fitem { grid-template-columns: auto minmax(0, 1fr); }
.aside .fitem .ftext, .aside .fitem details, :root[data-layout="phone"] .fitem .ftext, :root[data-layout="phone"] .fitem details { grid-column: 1 / -1; }
.ftime { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.badge b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; background: var(--surface-2); color: var(--ink); font-size: 11px; line-height: 1; }
.badge.react b { background: var(--p-ai); color: var(--surface); }
.badge.stop b, .badge.take b, .badge.trail b { background: var(--ink); color: var(--surface); }
.badge.error b { background: var(--up); color: var(--surface); }
.ftext { min-width: 0; overflow-wrap: anywhere; }
.fitem.quiet .ftext { color: var(--ink-2); }
.fitem details { grid-column: 3; }
.fitem details > summary { width: auto; font-weight: 500; color: var(--ink); }
.fbody { display: grid; gap: 10px; color: var(--ink-2); font-size: 13.5px; }
.fitem .fbody { margin-top: 8px; gap: 8px; }
.fbody ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.fbody b { color: var(--ink); }
.fbody .from-to { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
.feed-tools { display: flex; align-items: center; gap: 12px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink-2); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.linkbtn:hover { color: var(--ink); }

/* ---- 폰: 아래 탭 ---- */
.bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--hair); box-shadow: 0 -4px 16px var(--lift); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bottomnav button { position: relative; height: var(--nav-h); border: 0; background: none; display: grid; place-content: center; justify-items: center; gap: 2px; color: var(--muted); font-size: 11.5px; font-weight: 600; cursor: pointer; }
.bottomnav button svg { width: 22px; height: 22px; }
.bottomnav button[aria-selected="true"] { color: var(--ink); }
.bottomnav button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 32%; right: 32%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ink); }
.bottomnav .dot { position: absolute; top: 9px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 2px var(--surface); animation: pulse 1.6s ease-in-out infinite; }

/* 카드 폭에 맞춰 바뀌는 부분 (PC 본문 칸이 좁을 때도, 태블릿·폰에서도 같은 규칙).
   위의 기본 규칙을 덮어써야 해서 맨 끝에 둔다 */
.cq { container-type: inline-size; }
@container (max-width: 760px) {
  .row { grid-template-columns: 34px minmax(0, 1fr) auto 104px 96px; }
  .ret { font-size: 22px; }
  .row .stat.trades { display: none; }
}
@container (max-width: 600px) {
  .row { grid-template-columns: 30px minmax(0, 1fr) auto; grid-template-areas: "rank who ret" ". eq today"; row-gap: 8px; padding: 12px 8px; }
  .rank { grid-area: rank; }
  .who { grid-area: who; }
  .ret { grid-area: ret; text-align: right; font-size: 21px; }
  .row .stat.eq { grid-area: eq; }
  .row .stat.today { grid-area: today; text-align: right; }
  .pick { grid-template-columns: minmax(0, 1fr); }
  .holdings { grid-template-columns: minmax(0, 1fr); }
}
@container (max-width: 420px) {
  .blurb { display: none; }
  .name { font-size: 15px; }
  .ret { font-size: 19px; }
}
</style>

<div class="wrap">

/* ---------- 수익률 레이스 ---------- */
function seriesOf(m) {
  return m.players.map(p => {
    const pts = p.history.map(x => ({ date: x.date, ret: x.ret, eq: x.equity, live: false }));
    if (m.live.provisional) pts.push({ date: m.live.date, ret: p.ret, eq: p.equity, live: true });
    return { key: p.key, label: p.label, pts };
  });
}
function niceTicks(lo, hi, count) {
  const span = hi - lo;
  const raw = span / count;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(st => span / st <= count) || 10 * mag;
  const out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(+v.toFixed(10));
  return out;
}
function tickText(v) {
  const t = (v * 100).toFixed(2).replace(/\.?0+$/, "");
  return (v > 0 ? "+" : "") + (t === "-0" ? "0" : t) + "%";
}
function placeTip(tip, cx, cy) {
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let left = cx + 16, top = cy + 16;
  if (left + r.width > window.innerWidth - 8) left = cx - r.width - 16;
  if (top + r.height > window.innerHeight - 8) top = cy - r.height - 16;
  tip.style.left = Math.max(8, left) + "px";
  tip.style.top = Math.max(8, top) + "px";
}

function drawChart(host, m) {
  host.textContent = "";
  const ser = seriesOf(m);
  const n = Math.max(...ser.map(s => s.pts.length));
  if (n < 2) {
    host.append(h("div", { class: "empty" },
      h("strong", {}, "아직 그릴 선이 없어요"),
      h("span", {}, "첫 거래일이 끝나면 여기서 셋의 수익률이 경주를 시작해요.")));
    return;
  }
  const W = Math.max(host.clientWidth, 280);
  const dates = ser[0].pts.map(p => p.date);
  const vals = ser.flatMap(s => s.pts.map(p => p.ret)).concat(0);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 0.004) { const mid = (hi + lo) / 2; lo = mid - 0.002; hi = mid + 0.002; }
  const ticks = niceTicks(lo, hi, 5);
  lo = ticks[0]; hi = ticks[ticks.length - 1];

  const PH = W < 520 ? 200 : 250, padT = 12, padB = 30, padL = 54;
  const ends = ser.map(s => ({ key: s.key, v: s.pts[s.pts.length - 1].ret }));
  const yOf = v => padT + PH * (hi - v) / (hi - lo);
  const sortedY = ends.map(e => yOf(e.v)).sort((a, b) => a - b);
  const labelsFit = W >= 420 && sortedY.every((y, i) => i === 0 || y - sortedY[i - 1] >= 16);
  const padR = labelsFit ? 104 : 14;
  const plotW = W - padL - padR;
  const xOf = i => padL + plotW * (i / (n - 1));
  const H = padT + PH + padB;

  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", tabindex: "0",
    "aria-label": "수익률 레이스. " + ser.map(s => `${SHORT[s.key]} ${pct(s.pts[s.pts.length - 1].ret)}`).join(", ") });

  for (const t of ticks) {
    const y = yOf(t);
    svg.append(sv("line", { x1: padL, x2: padL + plotW, y1: y, y2: y, stroke: t === 0 ? cssVar("--axis") : cssVar("--grid"), "stroke-width": 1, "shape-rendering": "crispEdges" }));
    svg.append(sv("text", { x: padL - 8, y: y + 4, "text-anchor": "end", class: "tick" }, tickText(t)));
  }
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(plotW / 70))));
  dates.forEach((d, i) => {
    if (i % every !== 0 && i !== n - 1) return;
    if (i !== n - 1 && n - 1 - i < every) return;
    const live = ser[0].pts[i].live;
    svg.append(sv("text", { x: xOf(i), y: padT + PH + 20, "text-anchor": i === 0 ? "start" : i === n - 1 ? "end" : "middle", class: "tick" }, live ? "지금" : shortDay(d)));
  });

  const surface = cssVar("--surface");
  for (const s of ser) {
    const color = cssVar(COLOR[s.key]);
    const solid = s.pts.filter(p => !p.live);
    const dSolid = solid.map((p, i) => `${i ? "L" : "M"}${xOf(i).toFixed(1)},${yOf(p.ret).toFixed(1)}`).join("");
    if (solid.length > 1) svg.append(sv("path", { d: dSolid, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const last = s.pts[s.pts.length - 1];
    if (last.live && solid.length) {
      const a = solid.length - 1;
      svg.append(sv("path", { d: `M${xOf(a)},${yOf(solid[a].ret)}L${xOf(n - 1)},${yOf(last.ret)}`, fill: "none", stroke: color, "stroke-width": 2, "stroke-dasharray": "4 4", "stroke-linecap": "round" }));
    }
    svg.append(sv("circle", { cx: xOf(n - 1), cy: yOf(last.ret), r: 4, fill: last.live ? surface : color, stroke: last.live ? color : surface, "stroke-width": 2 }));
    if (labelsFit) {
      svg.append(sv("text", { x: xOf(n - 1) + 10, y: yOf(last.ret) + 4, class: "endlabel" },
        SHORT[s.key] + " ", sv("tspan", { class: "v" }, pct(last.ret))));
    }
  }

  const cross = sv("line", { y1: padT, y2: padT + PH, stroke: cssVar("--axis"), "stroke-width": 1, visibility: "hidden" });
  const dots = ser.map(s => sv("circle", { r: 4, fill: cssVar(COLOR[s.key]), stroke: surface, "stroke-width": 2, visibility: "hidden" }));
  svg.append(cross, ...dots);
  host.append(svg);

  const tip = document.getElementById("tip");
  let cur = n - 1;
  function show(i, cx, cy) {
    cur = i;
    const x = xOf(i);
    cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
    ser.forEach((s, k) => {
      const p = s.pts[i];
      dots[k].setAttribute("cx", x); dots[k].setAttribute("cy", yOf(p.ret)); dots[k].setAttribute("visibility", "visible");
    });
    tip.textContent = "";
    const live = ser[0].pts[i].live;
    tip.append(h("div", { class: "t-date" }, day(dates[i]) + (live ? " · 장중" : " 종가")));
    [...ser].sort((a, b) => b.pts[i].ret - a.pts[i].ret).forEach(s => {
      const p = s.pts[i];
      tip.append(h("div", { class: "t-row" }, h("i", { style: `--c: var(${COLOR[s.key]})` }), h("b", {}, pct(p.ret)), h("span", {}, `${SHORT[s.key]} · ${money(p.eq, m.currency)}`)));
    });
    placeTip(tip, cx, cy);
  }
  function hide() {
    cross.setAttribute("visibility", "hidden");
    dots.forEach(d => d.setAttribute("visibility", "hidden"));
    tip.hidden = true;
  }
  svg.addEventListener("pointermove", e => {
    const box = svg.getBoundingClientRect();
    const px = (e.clientX - box.left) * (W / box.width);
    const i = Math.min(n - 1, Math.max(0, Math.round((px - padL) / plotW * (n - 1))));
    show(i, e.clientX, e.clientY);
  });
  svg.addEventListener("pointerleave", hide);
  svg.addEventListener("blur", hide);
  const showAtCursor = () => {
    const box = svg.getBoundingClientRect();
    show(cur, box.left + xOf(cur) * (box.width / W), box.top + yOf(ser[0].pts[cur].ret) * (box.height / H));
  };
  svg.addEventListener("focus", showAtCursor);
  svg.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") cur = Math.max(0, cur - 1);
    else if (e.key === "ArrowRight") cur = Math.min(n - 1, cur + 1);
    else if (e.key === "Escape") return hide();
    else return;
    e.preventDefault();
    showAtCursor();
  });
}

      h("li", {}, "결정은 그 시점에 알 수 있는 정보로만 해요. 장 마감 뒤에는 확정된 종가까지 보고 정하고, 그 주문은 다음 거래일 시가에 체결돼요. AI가 안 적은 보유 종목은 주식 수 그대로 들고 가요."),
      h("li", {}, `장중에는 시세를 ${r.poll_seconds}초마다, 뉴스와 거래소 공시를 ${r.news_seconds}초마다 확인하다가 급변, 새 소식, AI가 걸어둔 가격 알림이 울리면 AI를 깨워요. 체결은 AI가 답한 그 순간의 시세로 하고, 그사이 가격이 ${P(r.chase_limit)} 넘게 움직였으면 그 답으로는 매매하지 않아요.`),
      h("li", {}, `손절, 따라 올라가는 손절, 목표가 매도는 AI 호출 없이 바로 집행해요. 손절도 트레일링도 없으면 종목 변동성에 맞춰 ${P(slo)}~${P(shi)} 손절이 기본으로 걸리고, 물타기해도 손절가는 내려가지 않아요. 손절선을 ${P(r.stop_fast_through)} 넘게 뚫으면 확인 없이 바로 팔아요.`),
      h("li", {}, `장중 매매 한도: 하루 매수는 평가금액의 ${P(r.max_buy_turnover)}까지, 오늘 ${P(r.max_daily_loss)} 넘게 잃으면 그날은 새로 안 사요. 오늘 판 종목은 다시 안 사고, 산 지 ${r.min_hold_min}분 안 된 종목은 AI가 팔 수 없어요. 장 시작 뒤 ${r.open_quiet_min}분과 마감 10분 전에는 AI가 새로 사지 않아요.`),
      h("li", {}, `한 업종에는 합쳐서 ${P(r.max_sector_weight)}까지만 담아요. 장중에 새로 살 수 있는 건 보유 종목과 전날 조사해 둔 후보뿐이라, 그날 크게 오른 종목을 따라 사지 않아요.`),
      h("li", {}, `기사 하나만 보고는 사고팔지 않아요. 기사만 들어온 '뉴스 점검'에서는 손절을 조이거나(지금 가격보다 ${P(r.news_min_stop_gap)} 넘게 아래까지만) 알림을 걸 수만 있고, 매매는 ${r.news_confirm_min}분 뒤 주가가 시장 대비 어떻게 반응했는지 본 다음에 해요.`),
      h("li", {}, "액면분할·병합으로 가격 기준이 바뀌면 주식 수와 평단, 손절가를 같은 비율로 고쳐요. 배당은 연 배당수익률을 거래일마다 나눠서 현금으로 넣어요 (근사치)."),
      h("li", {}, `AI는 ${r.model}이에요. 시총 상위 후보(${univ})를 보고 15개로 추린 다음, 뉴스·공시·지표와 다가오는 일정(FOMC, 옵션 만기, 미국 실적 발표)을 보고 최대 ${r.max_positions}종목을 종목당 ${P(r.min_weight)}~${P(r.max_weight)} 비중으로 정해요. 다른 선수의 순위는 AI한테 안 보여줘요.`),
      h("li", {}, `원숭이는 같은 후보에서 ${r.monkey_picks}종목을 무작위로 골라 똑같이 나눠 사고, 결정 ${r.monkey_every}번마다 새로 찍어요.`),
      h("li", {}, `존버는 첫날 ${benches}를 사서 계속 들고 가요.`),
      h("li", {}, `비용은 ${costs}로 계산해요. 대략적인 가정값이에요.`),
      h("li", {}, "시세·뉴스·공시는 네이버 증권, 미국 실적 일정은 나스닥, FOMC 일정은 연준 홈페이지에서 받아와요.")),
    h("p", { class: "disclaimer" }, "전부 가짜 돈으로 하는 실험이에요. 여기 나온 종목은 투자 추천이 아니에요."),
  ];
}

/* ---------- 실시간 ---------- */
const KIND = {
  react: ["AI 판단", "◆"], stop: ["손절", "▼"], trail: ["트레일링", "▼"], take: ["목표 도달", "▲"], fill: ["체결", "●"],
  alert: ["AI 알림", "◎"], fast_move: ["급변", "!"], index_move: ["지수 급변", "!"], day_step: ["오늘 등락", "±"],
  news: ["뉴스", "≡"], triage: ["뉴스 심사", "○"], info: ["안내", "i"], error: ["주의", "×"], daily: ["정산", "✓"],
  news_followup: ["뉴스 확인", "↻"], retry: ["다시 확인", "↻"],
};
const LOUD = new Set(["react", "stop", "trail", "take", "fill", "alert", "fast_move", "index_move", "day_step", "error", "daily", "news_followup", "retry"]);

/* 계획 한 줄: 손절 · 따라 올라가는 손절 · 목표가(분할 매도) */
function planLine(p, cur) {
  if (!p) return "";
  const bits = [];
  if (p.stop) bits.push(`손절 ${price(p.stop, cur)}` + (p.plan_default || p.default ? " (기본)" : ""));
  if (p.trail_pct) {
    const ts = p.trail_stop || (p.high ? p.high * (1 - p.trail_pct) : null);
    bits.push(`트레일링 ${Math.round(p.trail_pct * 100)}%` + (ts ? ` (지금 ${price(ts, cur)})` : ""));
  }
  if (p.take) {
    const frac = p.take_frac || 1;
    bits.push(`목표 ${price(p.take, cur)}` + (frac < 0.999 ? `에서 ${Math.round(frac * 100)}% 매도` : ""));
  }
  return bits.join(" · ");
}
/* 하루 결정 때 AI가 비율로 정한 계획 (체결 전이라 평단 대비 %) */
function planPct(p) {
  if (!p) return "";
  const n = v => Math.round(v * 100);
  const bits = [];
  if (p.stop_pct) bits.push(`손절 -${n(p.stop_pct)}%`);
  if (p.trail_pct) bits.push(`트레일링 ${n(p.trail_pct)}%`);
  if (p.take_pct) bits.push(`목표 +${n(p.take_pct)}%` + (p.take_frac && p.take_frac < 0.999 ? `에서 ${n(p.take_frac)}% 매도` : ""));
  return bits.length ? "계획: " + bits.join(" · ") : "";
}
function alertLine(a, cur) {
  const parts = [];
  if (a.below) parts.push(`${price(a.below, cur)} 아래로`);
  if (a.above) parts.push(`${price(a.above, cur)} 위로`);
  return `${a.name || a.code}: ${parts.join(" 또는 ")}` + (a.note ? ` — ${a.note}` : "");
}
const FEED = { all: false };

function localTime(iso, tz) {
  return new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).format(new Date(iso));
}
function minutesOfDay(iso, tz) {
  const [hh, mm] = localTime(iso, tz).split(":");
  return +hh * 60 + +mm;
}
function hm(s) { const [a, b] = s.split(":").map(Number); return a * 60 + b; }

function rtState(m) {
  const snap = m.rt && m.rt.snapshot;
  if (!snap) return null;
  const age = (Date.parse(DATA.generated_at) - Date.parse(snap.updated_at)) / 1000;
  const stale = age > Math.max(60, 3 * (snap.poll_seconds || DATA.rules.poll_seconds));
  const labels = {
    pre: "장 시작 전", settle: "마감 후 정산 대기", post: "정산 끝, 다음 장 대기", closed: "휴장 (주말)",
    holiday: "오늘은 휴장", quote_error: "시세 받는 중 오류", quotes_closed: "정규장이 아직 안 열렸어요",
  };
  let label = labels[snap.phase] || snap.phase, cls = "";
  if (snap.phase === "open") {
    const ago = age >= 5400 ? `${Math.round(age / 3600)}시간` : `${Math.round(age / 60)}분`;
    label = !stale ? "감시 중" : age >= 120 ? `엔진 멈춤 (마지막 신호 ${ago} 전)` : "엔진 응답 없음";
    cls = stale ? "warn" : "on";
  }
  else if (snap.phase === "quote_error") cls = "warn";
  return { snap, age, stale, label, cls };
}
const isLive = m => { const s = rtState(m); return !!(s && s.snap.phase === "open" && !s.stale); };

function liveStrip(m) {
  const s = rtState(m);
  if (!s) return null;
  const { snap } = s;
  const R = DATA.rules;
  const bits = [h("span", {}, `${localTime(snap.updated_at, m.tz)} 기준 (${m.tz === "Asia/Seoul" ? "한국시간" : "현지시간"})`)];
  if (snap.phase === "open" && snap.quote_age != null) bits.push(h("span", {}, `시세 지연 ${Math.round(snap.quote_age)}초`));
  if (snap.job_running) bits.push(h("span", { class: "chip think" }, "AI가 지금 생각 중"));
  if (snap.queued_events) bits.push(h("span", {}, `대기 중인 사건 ${snap.queued_events}건`));
  if (snap.counts) bits.push(h("span", {}, `오늘 AI 점검 ${snap.counts.reviews}/${R.max_reviews} · 뉴스 심사 ${snap.counts.triages}/${R.max_triages} · 매매 ${snap.counts.trades}건`));
  return h("div", { class: "rt-strip" }, h("span", { class: `chip ${s.cls}` }, s.label), bits);
}

function drawIntraday(host, m) {
  host.textContent = "";
  const it = m.rt && m.rt.intraday;
  const rows = ((it && it.points) || []).filter(r => m.players.every(p => r[p.key] != null));
  const empty = (title, body) => host.append(h("div", { class: "empty" }, h("strong", {}, title), h("span", {}, body)));
  if (rows.length < 2) return empty("오늘 장중 기록이 아직 없어요", "장이 열려 있고 실시간 엔진이 돌면 1분마다 한 점씩 찍혀요.");
  const x0 = hm(m.open), x1 = hm(m.close);
  const base = {};
  m.players.forEach(p => {
    const prev = [...p.history].reverse().find(x => x.date < it.date);
    base[p.key] = prev ? prev.equity : m.capital;
  });
  const ser = m.players.map(p => ({
    key: p.key, label: p.label,
    pts: rows.map(r => ({ x: Math.min(x1, Math.max(x0, minutesOfDay(r.t, m.tz))), ret: r[p.key] / base[p.key] - 1, eq: r[p.key], t: r.t })),
  }));
  const n = rows.length;
  const W = Math.max(host.clientWidth, 280);
  const vals = ser.flatMap(s => s.pts.map(p => p.ret)).concat(0);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 0.004) { const mid = (hi + lo) / 2; lo = mid - 0.002; hi = mid + 0.002; }
  const ticks = niceTicks(lo, hi, 5);
  lo = ticks[0]; hi = ticks[ticks.length - 1];
  const PH = W < 520 ? 200 : 240, padT = 12, padB = 30, padL = 54;
  const yOf = v => padT + PH * (hi - v) / (hi - lo);
  const sortedY = ser.map(s => yOf(s.pts[n - 1].ret)).sort((a, b) => a - b);
  const labelsFit = W >= 420 && sortedY.every((y, i) => i === 0 || y - sortedY[i - 1] >= 16);
  const padR = labelsFit ? 104 : 14;
  const plotW = W - padL - padR;
  const xOf = mins => padL + plotW * (mins - x0) / (x1 - x0);
  const H = padT + PH + padB;
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", tabindex: "0",
    "aria-label": "오늘 장중 수익률(어제 종가 대비). " + ser.map(s => `${SHORT[s.key]} ${pct(s.pts[n - 1].ret)}`).join(", ") });
  for (const t of ticks) {
    const y = yOf(t);
    svg.append(sv("line", { x1: padL, x2: padL + plotW, y1: y, y2: y, stroke: t === 0 ? cssVar("--axis") : cssVar("--grid"), "stroke-width": 1, "shape-rendering": "crispEdges" }));
    svg.append(sv("text", { x: padL - 8, y: y + 4, "text-anchor": "end", class: "tick" }, tickText(t)));
  }
  const hourStep = plotW < 420 ? 2 : 1;
  for (let mins = Math.ceil(x0 / 60) * 60, k = 0; mins <= x1; mins += 60, k++) {
    if (k % hourStep) continue;
    svg.append(sv("text", { x: xOf(mins), y: padT + PH + 20, "text-anchor": "middle", class: "tick" }, `${Math.floor(mins / 60)}:00`));
  }
  const surface = cssVar("--surface");
  for (const s of ser) {
    const color = cssVar(COLOR[s.key]);
    svg.append(sv("path", { d: s.pts.map((p, i) => `${i ? "L" : "M"}${xOf(p.x).toFixed(1)},${yOf(p.ret).toFixed(1)}`).join(""), fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const last = s.pts[n - 1];
    svg.append(sv("circle", { cx: xOf(last.x), cy: yOf(last.ret), r: 4, fill: color, stroke: surface, "stroke-width": 2 }));
    if (labelsFit) svg.append(sv("text", { x: xOf(last.x) + 10, y: yOf(last.ret) + 4, class: "endlabel" }, SHORT[s.key] + " ", sv("tspan", { class: "v" }, pct(last.ret))));
  }
  const cross = sv("line", { y1: padT, y2: padT + PH, stroke: cssVar("--axis"), "stroke-width": 1, visibility: "hidden" });
  const dots = ser.map(s => sv("circle", { r: 4, fill: cssVar(COLOR[s.key]), stroke: surface, "stroke-width": 2, visibility: "hidden" }));
  svg.append(cross, ...dots);
  host.append(svg);

  const tip = document.getElementById("tip");
  let cur = n - 1;
  function show(i, cx, cy) {
    cur = i;
    const x = xOf(ser[0].pts[i].x);
    cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
    ser.forEach((s, k) => { dots[k].setAttribute("cx", x); dots[k].setAttribute("cy", yOf(s.pts[i].ret)); dots[k].setAttribute("visibility", "visible"); });
    tip.textContent = "";
    tip.append(h("div", { class: "t-date" }, `${localTime(ser[0].pts[i].t, m.tz).slice(0, 5)} · 어제 종가 대비`));
    [...ser].sort((a, b) => b.pts[i].ret - a.pts[i].ret).forEach(s => {
      const p = s.pts[i];
      tip.append(h("div", { class: "t-row" }, h("i", { style: `--c: var(${COLOR[s.key]})` }), h("b", {}, pct(p.ret)), h("span", {}, `${SHORT[s.key]} · ${money(p.eq, m.currency)}`)));
    });
    placeTip(tip, cx, cy);
  }
  function hide() {
    cross.setAttribute("visibility", "hidden");
    dots.forEach(d => d.setAttribute("visibility", "hidden"));
    tip.hidden = true;
  }
  svg.addEventListener("pointermove", e => {
    const box = svg.getBoundingClientRect();
    const mins = x0 + ((e.clientX - box.left) * (W / box.width) - padL) / plotW * (x1 - x0);
    let best = 0;
    for (let i = 1; i < n; i++) if (Math.abs(ser[0].pts[i].x - mins) < Math.abs(ser[0].pts[best].x - mins)) best = i;
    show(best, e.clientX, e.clientY);
  });
  svg.addEventListener("pointerleave", hide);
  svg.addEventListener("blur", hide);
  const showAtCursor = () => {
    const box = svg.getBoundingClientRect();
    show(cur, box.left + xOf(ser[0].pts[cur].x) * (box.width / W), box.top + yOf(ser[0].pts[cur].ret) * (box.height / H));
  };
  svg.addEventListener("focus", showAtCursor);
  svg.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") cur = Math.max(0, cur - 1);
    else if (e.key === "ArrowRight") cur = Math.min(n - 1, cur + 1);
    else if (e.key === "Escape") return hide();
    else return;
    e.preventDefault();
    showAtCursor();
  });
}

function reactionDetails(f, m) {
  const r = f.reaction;
  const side = x => `${x.name} ${x.side === "buy" ? "매수" : "매도"}`;
  const what = r.fills && r.fills.length ? r.fills.map(side).join(", ")
    : (r.blocked || []).length && (r.recheck || []).length ? "매매는 주가 반응을 본 뒤로 미룸"
    : (r.actions || []).length ? "계획만 고침" : "지켜보기로 함";
  const summary = what + (r.assessment ? ` · ${r.assessment}` : "");
  const list = (title, items) => items.length ? h("div", {}, h("b", {}, title), h("ul", {}, items.map(x => h("li", {}, x)))) : null;
  const acts = (r.actions || []).map(a => [
    h("b", {}, a.name), " ",
    h("span", { class: "from-to" }, a.to == null ? "비중 그대로" : `${Math.round(a.from * 100)}% → ${Math.round(a.to * 100)}%`),
    a.plan && planLine(a.plan, m.currency) ? ` · ${planLine(a.plan, m.currency)}` : "",
    a.reason ? ` — ${a.reason}` : "",
  ]);
  const fills = (r.fills || []).map(x => `${side(x)} ${x.shares.toLocaleString("ko-KR")}주 @ ${price(x.price, m.currency)}`);
  const alerts = r.alerts == null ? [] : r.alerts.length ? r.alerts.map(a => alertLine(a, m.currency)) : ["걸어둔 알림을 모두 지움"];
  const pace = r.next_check_min ? [`${r.next_check_min}분 뒤에 다시 보기로 함`] : [];
  const recheck = (r.recheck || []).map(x => `${x.name}: ${localTime(x.due, m.tz).slice(0, 5)}에 기사 뒤 주가 반응을 보고 다시 판단`);
  return h("details", { "data-k": `feed-${m.key}-${f.t}` },
    h("summary", {}, summary),
    h("div", { class: "fbody" },
      list("무슨 일이 있었나", r.trigger || []),
      r.assessment ? h("p", {}, r.assessment) : null,
      list("바꾼 것", acts),
      list("체결", fills),
      list("새로 건 알림", alerts),
      list("주가 반응 확인 예약", recheck),
      list("다음 점검", pace),
      list("메모", r.notes || []),
      r.cash_reason ? h("p", {}, r.cash_reason) : null,
      h("p", { class: "meta" }, [r.model && `모델 ${r.model}`, r.seconds && `${r.seconds}초 걸림`].filter(Boolean).join(" · "))));
}

function feedItem(f, m) {
  const newsReview = f.kind === "react" && f.reaction && f.reaction.mode === "news";
  const meta = newsReview ? ["뉴스 점검", "◇"] : KIND[f.kind] || [f.kind, "•"];
  return h("li", { class: `fitem${LOUD.has(f.kind) ? "" : " quiet"}` },
    h("span", { class: "ftime" }, f.t ? localTime(f.t, m.tz) : ""),
    h("span", { class: `badge ${f.kind}` }, h("b", {}, meta[1]), meta[0]),
    f.kind === "react" && f.reaction ? reactionDetails(f, m) : h("span", { class: "ftext" }, f.text));
}

/* 실시간 칸: 엔진 상태, 오늘 매매 제한, AI가 지켜보는 것, 다가오는 일정 */
function watchCard(m) {
  const s = rtState(m);
  const lim = m.limits;
  const follow = m.followups || [];
  const blocks = [];
  if (s) blocks.push(liveStrip(m));
  else blocks.push(h("p", { class: "sub" }, "실시간 엔진이 꺼져 있어요. PC에서 start_live.bat을 켜 두면 장중에 여기가 채워져요."));
  if (lim && lim.blocked && lim.blocked.length) {
    blocks.push(h("div", { class: "notice", role: "status" }, h("b", {}, "지금은 AI가 새로 사지 않아요"), h("ul", {}, lim.blocked.map(x => h("li", {}, x)))));
  }
  if (lim) blocks.push(h("p", { class: "meta" }, `오늘 남은 장중 매수 한도 ${money(lim.buy_left, m.currency)}`));
  if ((m.alerts || []).length) blocks.push(h("div", {}, h("b", {}, "AI가 걸어둔 가격 알림"), h("ul", {}, m.alerts.map(a => h("li", {}, alertLine(a, m.currency))))));
  if (follow.length) blocks.push(h("div", {}, h("b", {}, "뉴스 뒤 주가 반응 확인"), h("ul", {}, follow.map(x => h("li", {}, `${localTime(x.due, m.tz).slice(0, 5)} ${x.name} — ${x.title}`)))));
  if (m.next_check_at) blocks.push(h("p", { class: "meta" }, `아무 일 없으면 ${localTime(m.next_check_at, m.tz).slice(0, 5)}에 다시 점검해요`));
  if ((m.agenda || []).length) blocks.push(h("div", {}, h("b", {}, "다가오는 일정"), h("ul", {}, m.agenda.map(a => h("li", {}, a)))));
  return h("section", { class: "card" },
    h("div", { class: "card-head" }, h("h2", {}, "실시간"), h("p", { class: "sub" }, `시세 ${DATA.rules.poll_seconds}초, 뉴스·공시 ${DATA.rules.news_seconds}초마다 확인해요.`)),
    h("div", { class: "fbody" }, blocks));
}

function intradayCard(m) {
  if (!m.rt) return null;
  const host = h("div", { class: "chart" });
  const card = h("section", { class: "card" },
    h("div", { class: "card-head" },
      h("h2", {}, "오늘 장중 흐름"),
      h("p", { class: "sub" }, "어제 종가를 0%로 놓고 1분마다 찍어요.")),
    h("div", { class: "legend" }, m.players.map(p => h("span", {}, h("i", { style: `--c: var(${COLOR[p.key]})` }), p.label))),
    host);
  card._draw = () => drawIntraday(host, m);
  return card;
}

function feedCard(m) {
  const all = (m.rt && m.rt.feed) || [];
  const loud = all.filter(f => LOUD.has(f.kind));
  const hidden = all.length - loud.length;
  const shown = (FEED.all ? all : loud).slice(0, 40);
  const toggle = hidden > 0 || FEED.all
    ? h("button", { class: "linkbtn", type: "button", onclick: () => { FEED.all = !FEED.all; render(); } }, FEED.all ? "중요한 것만 보기" : `뉴스·심사 등 ${hidden}건 더 보기`)
    : null;
  return h("section", { class: "card feed-card" },
    h("div", { class: "card-head" },
      h("h2", {}, "지금 벌어지는 일"),
      h("p", { class: "sub" }, "급변, 새 소식, AI가 걸어둔 알림이 울리면 AI를 깨워요. 판단을 누르면 자세히 볼 수 있어요.")),
    shown.length
      ? h("ul", { class: "feed" }, shown.map(f => feedItem(f, m)))
      : h("div", { class: "empty" }, h("strong", {}, "아직 큰 일은 없었어요"), h("span", {}, "급변, 손절, AI 판단 같은 일이 생기면 여기에 쌓여요.")),
    toggle && h("div", { class: "feed-tools" }, toggle));
}

/* ---------- 조립: 기기마다 배치가 다르다 ---------- */
const SECTIONS = [["rank", "순위", ICON.podium], ["live", "실시간", ICON.pulse], ["ai", "AI", ICON.spark], ["hold", "보유", ICON.wallet]];

function renderMarket(m) {
  const panel = h("section", { class: "panel", id: `panel-${m.key}`, role: "tabpanel", "aria-labelledby": `tab-${m.key}` });
  const status = h("div", { class: "status" },
    h("span", {}, m.sessions ? `리그 ${m.sessions}일째` : "개막일"),
    h("span", {}, `${day(m.started)} 종가 기준 출발`),
    m.pending && h("span", { class: "chip" }, `주문 대기: ${day(m.pending.decided_on)} 결정분, 다음 장 시가에 체결`),
    m.live.provisional && h("span", { class: "chip live" }, `${day(m.live.date)} 장중 가격 반영`));
  const race = raceCard(m);
  const intraday = intradayCard(m);
  const top = [status, headline(m), luckNote(m)];
  const L = LAYOUT.now;
  if (L === "desktop") {
    panel.append(...top.filter(Boolean), h("div", { class: "board" },
      h("div", { class: "mainc" }, ...[standingsCard(m), race, intraday, decisionCard(m), holdingsCard(m), tradesCard(m), journalCard(m)].filter(Boolean)),
      h("aside", { class: "aside", "aria-label": "실시간" }, watchCard(m), feedCard(m))));
  } else if (L === "tablet") {
    panel.append(...[...top, standingsCard(m), watchCard(m), intraday, feedCard(m), race, decisionCard(m), holdingsCard(m), tradesCard(m), journalCard(m)].filter(Boolean));
  } else {
    const parts = {
      rank: () => [...top, standingsCard(m), race, h("footer", { class: "foot card" }, rulesContent())],
      live: () => [watchCard(m), intraday, feedCard(m)],
      ai: () => [decisionCard(m) || h("div", { class: "empty" }, h("strong", {}, "아직 AI 결정이 없어요"), h("span", {}, "장이 끝나고 하루 정산 때 첫 결정을 해요.")), journalCard(m)],
      hold: () => [holdingsCard(m), tradesCard(m)],
    };
    panel.append(...parts[UI.section]().filter(Boolean));
  }
  panel._charts = [race, intraday].filter(c => c && panel.contains(c));
  return panel;
}

const UI = { tab: null, open: new Set(), scroll: 0, section: "rank", holder: "ai" };
const conn = { ok: true };
let views = [], buttons = [];

/* 다시 그려도 열어둔 항목·스크롤·탭이 그대로 있게 한다 */
function captureUI() {
  UI.open = new Set([...document.querySelectorAll("details[open][data-k]")].map(d => d.dataset.k));
  UI.scroll = window.scrollY;
}
function restoreUI() {
  document.querySelectorAll("details[data-k]").forEach(d => { if (UI.open.has(d.dataset.k)) d.open = true; });
  window.scrollTo(0, UI.scroll);
}
function drawPanel(panel) { (panel._charts || []).forEach(c => c._draw()); }
function select(key, focus) {
  views.forEach(({ m, panel }, i) => {
    const on = m.key === key;
    panel.hidden = !on;
    buttons[i].setAttribute("aria-selected", on ? "true" : "false");
    buttons[i].tabIndex = on ? 0 : -1;
    if (on) { drawPanel(panel); if (focus) buttons[i].focus(); }
  });
  UI.tab = key;
  store.set("league-tab", key);
  if (location.hash !== `#${key}`) history.replaceState(null, "", `#${key}`);
  renderBottomNav();
}
function renderBottomNav() {
  const nav = document.getElementById("bottomnav");
  nav.hidden = LAYOUT.now !== "phone";
  if (nav.hidden) return nav.replaceChildren();
  const m = DATA.markets.find(x => x.key === UI.tab) || DATA.markets[0];
  nav.replaceChildren(...SECTIONS.map(([k, label, ic]) => h("button", {
    type: "button", role: "tab", "aria-selected": UI.section === k ? "true" : "false",
    onclick: () => { UI.section = k; store.set("league-section", k); render(); window.scrollTo(0, 0); },
  }, ic(), label, k === "live" && isLive(m) ? h("i", { class: "dot", "aria-label": "감시 중" }) : null)));
}
function stampUpdate() {
  const latest = DATA.markets.map(m => m.updated_at).filter(Boolean).sort().pop();
  const head = DATA.live_mode ? (conn.ok ? "실시간 연결됨 · " : "연결 끊김 · ") : "";
  document.getElementById("stamp").textContent = head + (latest ? `마지막 업데이트 ${stampText(latest)} (한국시간)` : "");
}
function render() {
  captureUI();
  ROOT.setAttribute("data-layout", LAYOUT.now);
  const panels = document.getElementById("panels");
  panels.textContent = "";
  views = DATA.markets.map(m => ({ m, panel: renderMarket(m) }));
  views.forEach(v => panels.append(v.panel));
  select(views.some(v => v.m.key === UI.tab) ? UI.tab : views[0].m.key);
  const rules = document.getElementById("rules");
  rules.hidden = LAYOUT.now === "phone";
  rules.replaceChildren(...(rules.hidden ? [] : rulesContent()));
  stampUpdate();
  restoreUI();
}

async function refresh() {
  if (document.hidden) return;
  try {
    const res = await fetch("/api/data", { cache: "no-store" });
    if (!res.ok) throw new Error(String(res.status));
    DATA = await res.json();
    conn.ok = true;
    render();
  } catch (e) {
    conn.ok = false;
    stampUpdate();
  }
}

function boot() {
  const saved = store.get("league-theme");
  document.getElementById("controls").prepend(themeControl());
  applyTheme(["auto", "light", "dark"].includes(saved) ? saved : "auto");
  const tabs = document.getElementById("tabs");
  if (!DATA || !DATA.markets.length) {
    document.getElementById("panels").append(h("p", { class: "headline" }, "아직 리그 기록이 없어요. python -m trader run 을 먼저 돌려주세요."));
    return;
  }
  UI.section = SECTIONS.some(s => s[0] === store.get("league-section")) ? store.get("league-section") : "rank";
  UI.holder = ["ai", "monkey", "hodl"].includes(store.get("league-holder")) ? store.get("league-holder") : "ai";
  buttons = DATA.markets.map(m => h("button", { role: "tab", id: `tab-${m.key}`, "aria-controls": `panel-${m.key}`, type: "button" }, `${m.name} 리그`));
  tabs.append(...buttons);
  buttons.forEach((b, i) => {
    b.addEventListener("click", () => select(DATA.markets[i].key));
    b.addEventListener("keydown", e => {
      const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (!d) return;
      e.preventDefault();
      select(DATA.markets[(i + d + DATA.markets.length) % DATA.markets.length].key, true);
    });
  });
  let first = location.hash.slice(1);
  if (!DATA.markets.some(m => m.key === first)) first = store.get("league-tab");
  UI.tab = DATA.markets.some(m => m.key === first) ? first : DATA.markets[0].key;
  render();

  let raf = 0;
  const redraw = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => views.forEach(v => { if (!v.panel.hidden) drawPanel(v.panel); })); };
  const relayout = () => {
    const L = detectLayout();
    if (L === LAYOUT.now) return redraw();
    LAYOUT.now = L;
    render();
  };
  window.addEventListener("resize", redraw);
  for (const q of Object.values(MQ)) q.addEventListener ? q.addEventListener("change", relayout) : q.addListener(relayout);
  const scheme = window.matchMedia("(prefers-color-scheme: dark)");
  if (scheme.addEventListener) scheme.addEventListener("change", redraw);
  /* 보는 곳(앱)이 테마를 바꾸면 따라간다. 여기서 고른 테마가 있으면 그게 이긴다 */
  new MutationObserver(() => {
    const now = ROOT.getAttribute("data-theme");
    if (now !== THEME.expect) {
      THEME.host = now;
      if (THEME.mode !== "auto") applyTheme(THEME.mode); else THEME.expect = now;
    }
    redraw();
  }).observe(ROOT, { attributes: true, attributeFilter: ["data-theme"] });
  if (DATA.live_mode) {
    setInterval(refresh, 5000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  }
}
boot();
</script>

</body>
</html>
